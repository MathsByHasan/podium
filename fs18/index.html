<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FS L1 – Metric conversions</title>
<style>
@font-face{font-family:Carlito;src:url(f/Carlito-Regular.ttf);font-weight:400}
@font-face{font-family:Carlito;src:url(f/Carlito-Bold.ttf);font-weight:700}
@font-face{font-family:Carlito;src:url(f/Carlito-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:Carlito;src:url(f/Carlito-BoldItalic.ttf);font-weight:700;font-style:italic}
:root{--bg:#10231a;--bar:#0b1a12;--acc:#2E8B57}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%}
#box{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#fff;overflow:hidden;box-shadow:0 6px 30px #0008;user-select:none;font-family:Carlito,Calibri,"Segoe UI",sans-serif;color:#111}
.sl{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;background-color:#fff;opacity:0;transition:opacity .35s;pointer-events:none}
.sl.on{opacity:1;pointer-events:auto}
.e{position:absolute}
.e img{width:100%;height:100%;display:block}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible}
.pa{line-height:1.2;white-space:normal;overflow-wrap:break-word;min-width:0}
.lk,.btn{cursor:pointer}
.lk:hover{outline:3px solid #fff8;outline-offset:1px}
.hid{opacity:0;visibility:hidden;pointer-events:none}
.e{transition:opacity .45s,transform .45s}
.hid[data-fx=zoom]{transform:scale(.4)}
.e.show{opacity:1;visibility:visible;pointer-events:auto}
.e.show[data-fx=zoom]{transform:none}
.tm{position:absolute;background:#fff;border:3px solid #1F3A6E;border-radius:4px;text-align:center;font-weight:700;color:#1F3A6E}
.tm .t{font-size:58px;line-height:1;margin-top:8px}
.tm .b{position:absolute;left:14px;right:14px;bottom:12px;height:9px;background:#dde7e0;border-radius:5px;overflow:hidden}
.tm .b i{display:block;height:100%;background:#2E8B57;width:100%;transition:width 1s linear}
.tm.low .t{color:#C00000}.tm.low .b i{background:#C00000}
#bar{height:56px;background:var(--bar);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}
#bar button{background:#1e3a2b;color:#fff;border:1px solid #2e5a42;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
#bar button:hover{background:var(--acc)}
#bar .sp{flex:1}#info{opacity:.8;min-width:90px;text-align:center}
#hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .6s;pointer-events:none}
#start{position:fixed;inset:0;background:#10231af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center;padding:20px}
#start h1{margin:0;font-size:clamp(22px,4vw,40px)}#start p{margin:0;max-width:560px;opacity:.85;line-height:1.5}
#start button{font-size:18px;padding:14px 34px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
@media(max-width:600px){#bar button{padding:8px 9px}#info{min-width:60px}}
</style></head><body>
<div id="start"><h1>FS Level 1 · Metric conversions</h1>
<p>Click the slide, press <b>→</b> or <b>Space</b> to reveal each step; <b>←</b> goes back. The Menu, board, Hint/Answer and treasure-map buttons work as in the PowerPoint.</p>
<button id="go">Start</button></div>
<div id="wrap"><div id="box"><div id="stage"></div></div>
<div id="bar"><button id="bm">⌂ Menu</button><button id="bp">◀ Back</button><span id="info"></span><button id="bn">Next ▶</button><span class="sp"></span><button id="bs" title="Sound">🔊</button><button id="bf" title="Full screen">⛶</button></div></div>
<div id="hint"></div>
<script>
const MENU=4;let S=[],cur=0,step=0,sound=true,audio=null,tmr=null;
const stage=document.getElementById('stage'),box=document.getElementById('box'),info=document.getElementById('info');
const dateStr=new Date().toLocaleDateString('en-GB');
function fit(){const s=Math.min(box.clientWidth/1280,box.clientHeight/720);stage.style.transform=`scale(${s})`;
  stage.style.left=(box.clientWidth-1280*s)/2+'px';stage.style.top=(box.clientHeight-720*s)/2+'px'}
addEventListener('resize',fit);
const els={};
function mkSlide(s){
  const d=document.createElement('div');d.className='sl';if(s.bg)d.style.backgroundImage=`url(${s.bg})`;
  d.innerHTML=s.html;d.querySelectorAll('.date').forEach(e=>e.textContent=dateStr);
  d.querySelectorAll('[data-s]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();go(+e.dataset.s)}));
  d.querySelectorAll('[data-u]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();open(e.dataset.u,'_blank','noopener')}));
  d.querySelectorAll('[data-tog]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();
    d.querySelectorAll('[data-k="'+e.dataset.tog+'"]').forEach(x=>x.classList.toggle('show'))}));
  if(s.timer&&s.timerTotal){const t=document.createElement('div');t.className='tm';const r=s.timer;
    t.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;t.innerHTML='<div class="t"></div><div class="b"><i></i></div>';d.appendChild(t)}
  stage.appendChild(d);return d;
}
function groups(i){return S[i].groups}
function apply(d,s,k){const g=s.groups;d.querySelectorAll('[data-g]').forEach(e=>e.classList.toggle('show',g.indexOf(e.dataset.g)<k))}
function stopT(){clearInterval(tmr);tmr=null;if(audio){audio.pause();audio=null}}
function startT(d,s){const t=d.querySelector('.tm');if(!t)return;let left=s.timerTotal;const tot=left;
  const tx=t.querySelector('.t'),bar=t.querySelector('i');t.classList.remove('low');bar.style.transition='none';bar.style.width='100%';
  const paint=()=>{tx.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<=Math.max(10,tot*.1));bar.style.width=(left/tot*100)+'%'};
  paint();setTimeout(()=>bar.style.transition='width 1s linear',50);
  tmr=setInterval(()=>{if(left>0){left--;paint()}else clearInterval(tmr)},1000);
  if(sound&&s.snd){audio=new Audio(s.snd);audio.play().catch(()=>{})}}
function go(n,k=0){
  const i=n-1;if(!S[i])return;
  if(i!==cur||!els[i]){stopT();
    Object.values(els).forEach(e=>e.classList.remove('on'));
    if(!els[i])els[i]=mkSlide(S[i]);
    els[i].classList.add('on');
    cur=i;history.replaceState(null,'','#'+n);
    els[i].querySelectorAll('[data-k]').forEach(x=>x.classList.remove('show'));
    startT(els[i],S[i]);
    [i+1,i+2].forEach(j=>{if(S[j]&&!els[j])els[j]=mkSlide(S[j])});
  }
  step=Math.max(0,Math.min(k,S[i].groups.length));apply(els[i],S[i],step);label();
}
function vis(){return S.map((s,i)=>s.hidden?-1:i).filter(i=>i>=0)}
function label(){const v=vis();const p=v.indexOf(cur);const g=S[cur].groups.length;
  info.textContent=(p>=0?p+1:'·')+' / '+v.length+(g?`  ·  step ${step}/${g}`:'')}
function next(){if(step<S[cur].groups.length)return go(cur+1,step+1);const v=vis().filter(i=>i>cur);if(v.length)go(v[0]+1,0)}
function prev(){if(step>0)return go(cur+1,step-1);const v=vis().filter(i=>i<cur);if(v.length){const p=v[v.length-1];go(p+1,S[p].groups.length)}}
stage.addEventListener('click',()=>{if(step<S[cur].groups.length)next();else flash()});
function flash(){const h=document.getElementById('hint');h.textContent=cur===S.length-1?'End of the lesson':'Use the buttons on the slide, or Next ▶ to move on';h.style.opacity=1;setTimeout(()=>h.style.opacity=0,1800)}
bn.onclick=next;bp.onclick=prev;bm.onclick=()=>go(MENU);
bf.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
bs.onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊':'🔇';if(!sound&&audio){audio.pause();audio=null}};
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')go(1);else if(e.key==='f'||e.key==='F')bf.click()});
let start=1;
fetch('slides.json').then(r=>r.json()).then(j=>{S=j;const h=parseInt(location.hash.slice(1));if(h>0&&h<=S.length)start=h;fit()});
go_btn=document.getElementById('go');go_btn.onclick=()=>{document.getElementById('start').remove();fit();const iv=setInterval(()=>{if(S.length){clearInterval(iv);go(start)}},30)};
</script></body></html>
