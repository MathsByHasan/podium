<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FS L1 – Metric conversions</title>
<style>
:root{--bg:#10231a;--bar:#0b1a12;--fg:#fff;--acc:#2E8B57}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%}
#stagebox{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
#stage{position:relative;aspect-ratio:16/9;background:#fff;box-shadow:0 6px 30px #0008;max-width:100%;max-height:100%;width:min(100%,calc((100vh - 64px)*16/9));overflow:hidden;user-select:none}
#stage img.f{position:absolute;inset:0;width:100%;height:100%;transition:opacity .28s;pointer-events:none}
#stage img.ov{position:absolute;pointer-events:none;animation:in .2s}
#stage img.tm{position:absolute;pointer-events:none}
@keyframes in{from{opacity:0}to{opacity:1}}
.hs{position:absolute;cursor:pointer;border-radius:6px;transition:box-shadow .15s,background .15s}
.hs:hover{box-shadow:0 0 0 3px #fff9,0 0 0 5px var(--acc);background:#2e8b5722}
#bar{height:56px;background:var(--bar);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}
#bar button{background:#1e3a2b;color:#fff;border:1px solid #2e5a42;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
#bar button:hover{background:var(--acc)}
#bar .sp{flex:1}#info{opacity:.8;min-width:90px;text-align:center}
#hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .6s;pointer-events:none}
#start{position:fixed;inset:0;background:#10231ae6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center;padding:20px}
#start h1{margin:0;font-size:clamp(22px,4vw,40px)}#start p{margin:0;max-width:560px;opacity:.85;line-height:1.5}
#start button{font-size:18px;padding:14px 34px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
@media(max-width:600px){#bar button{padding:8px 9px}#info{min-width:60px}}
</style></head><body>
<div id="start"><h1>FS Level 1 · Metric conversions</h1>
<p>Click-through version of the lesson deck. Click the slide, press <b>→</b> or <b>Space</b> to reveal each step; <b>←</b> goes back. Menu, board and treasure-map buttons work as in the deck.</p>
<button id="go">Start</button></div>
<div id="wrap"><div id="stagebox"><div id="stage"></div></div>
<div id="bar"><button id="bm" title="Menu">⌂ Menu</button><button id="bp">◀ Back</button><span id="info"></span><button id="bn">Next ▶</button><span class="sp"></span><button id="bs" title="Sound">🔊</button><button id="bf" title="Full screen">⛶</button></div></div>
<div id="hint"></div>
<script>
const SW=12192000,SH=6858000,MENU=4;
let S=[],cur=1,st=0,sound=true,audio=null,shown={},hist=[];
const stage=document.getElementById('stage'),info=document.getElementById('info');
let layerA=null,layerB=null,front=0;
function mk(){const i=document.createElement('img');i.className='f';i.style.opacity=0;i.alt='';stage.appendChild(i);return i}
fetch('slides.json').then(r=>r.json()).then(j=>{S=j;layerA=mk();layerB=mk();
 const h=parseInt(location.hash.slice(1));if(h>0&&h<=S.length)cur=h;});
const vis=()=>S.filter(s=>!s.hidden).map(s=>s.n);
function clear(){stage.querySelectorAll('.hs,.ov,.tm').forEach(e=>e.remove());}
function frac(r){return `left:${r[0]/SW*100}%;top:${r[1]/SH*100}%;width:${r[2]/SW*100}%;height:${r[3]/SH*100}%`}
function stopAudio(){if(audio){audio.pause();audio=null}}
function show(n,k,dir){
  const s=S[n-1];if(!s)return;
  const slideChanged=n!==cur||!layerA.dataset.n||layerA.dataset.n===undefined;
  const newSlide=(layerA.dataset.cur!=String(n));
  cur=n;st=Math.max(0,Math.min(k,s.states.length-1));
  const url=s.states[st];
  const t=front?layerA:layerB,o=front?layerB:layerA;front^=1;
  t.src=url;t.onload=()=>{t.style.opacity=1;o.style.opacity=0};
  layerA.dataset.cur=layerB.dataset.cur=String(n);
  if(newSlide){
    clear();shown={};stopAudio();
    s.links.forEach(l=>{const d=document.createElement('div');d.className='hs';d.style.cssText=frac(l.r);
      d.onclick=e=>{e.stopPropagation();if(l.s){hist.push(cur);show(l.s,0)}else window.open(l.u,'_blank','noopener')};stage.appendChild(d)});
    s.ha.forEach(b=>{const d=document.createElement('div');d.className='hs';d.style.cssText=frac(b.r);
      d.onclick=e=>{e.stopPropagation();toggle(s,b.k+b.n)};stage.appendChild(d)});
    if(s.timer){const g=document.createElement('img');g.className='tm';g.style.cssText=frac(s.timer.r);g.src='media/'+s.timer.f+'?'+Date.now();stage.appendChild(g);
      if(sound&&s.snd){audio=new Audio(s.snd);audio.play().catch(()=>{})}}
    document.getElementById('hint').style.opacity=0;
    history.replaceState(null,'','#'+n);
    [n+1,n+2].forEach(m=>{if(S[m-1])S[m-1].states.slice(0,2).forEach(u=>{new Image().src=u})});
  }
  if(st+1<s.states.length)new Image().src=s.states[st+1];
  const v=vis();info.textContent=(v.indexOf(n)>=0?v.indexOf(n)+1:'·')+' / '+v.length+(s.states.length>1?`  ·  step ${st+1}/${s.states.length}`:'');
}
function toggle(s,key){
  const ex=stage.querySelector('.ov[data-k="'+key+'"]');
  if(ex){ex.remove();return}
  const o=s.ov[key];if(!o)return;
  const i=document.createElement('img');i.className='ov';i.dataset.k=key;i.src=o.p;
  i.style.cssText=`left:${o.b[0]*100}%;top:${o.b[1]*100}%;width:${o.b[2]*100}%;height:${o.b[3]*100}%`;stage.appendChild(i);
}
function next(){const s=S[cur-1];if(st+1<s.states.length)return show(cur,st+1);
  const v=vis().filter(x=>x>cur);if(v.length)show(v[0],0)}
function prev(){if(st>0)return show(cur,st-1);
  const v=vis().filter(x=>x<cur);if(v.length){const p=v[v.length-1];show(p,S[p-1].states.length-1)}}
stage.addEventListener('click',()=>{const s=S[cur-1];if(st+1<s.states.length)next();else flash()});
function flash(){const h=document.getElementById('hint');const s=S[cur-1];
  h.textContent=(s.links.length||s.ha.length)?'Use the buttons on the slide, or Next ▶ to move on':(cur===S.length?'End of the lesson':'Next ▶ to move on');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,1800)}
document.getElementById('bn').onclick=next;document.getElementById('bp').onclick=prev;
document.getElementById('bm').onclick=()=>show(MENU,0);
document.getElementById('bf').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.getElementById('bs').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊':'🔇';if(!sound)stopAudio()};
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')show(1,0);else if(e.key==='f'||e.key==='F')document.getElementById('bf').click()});
document.getElementById('go').onclick=()=>{document.getElementById('start').remove();const iv=setInterval(()=>{if(S.length){clearInterval(iv);show(cur,0)}},30)};
</script></body></html>
